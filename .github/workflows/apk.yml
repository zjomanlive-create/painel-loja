name: Gerar APK e EXE

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  apk:
    name: APK Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Organizar arquivos
        shell: bash
        run: |
          mkdir -p www scripts electron
          for f in app.js config.js index.html nuvem.js style.css; do [ -f "$f" ] && mv "$f" www/; done
          [ -f copiar-lib.js ] && mv copiar-lib.js scripts/
          [ -f main.js ] && mv main.js electron/
          ls -R www scripts electron
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Instalar dependencias
        run: npm install
      - name: Criar projeto Android
        run: |
          npx cap add android
          npx cap sync android
      - name: Compilar APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: painel-loja-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

  exe:
    name: Instalador Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Organizar arquivos
        shell: bash
        run: |
          mkdir -p www scripts electron
          for f in app.js config.js index.html nuvem.js style.css; do [ -f "$f" ] && mv "$f" www/; done
          [ -f copiar-lib.js ] && mv copiar-lib.js scripts/
          [ -f main.js ] && mv main.js electron/
          ls -R www scripts electron
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar dependencias
        run: npm install
      - name: Gerar instalador
        run: npx electron-builder --win --publish never
      - name: Guardar instalador
        uses: actions/upload-artifact@v4
        with:
          name: painel-loja-exe
          path: dist/*.exe
